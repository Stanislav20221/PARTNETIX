{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход партнера</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: url("{% static 'users/images/admin-registr.jpg' %}") no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(8, 10, 30, 0.55);
            backdrop-filter: blur(2px);
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 360px;
            padding: 30px;
            border-radius: 22px;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            backdrop-filter: blur(18px);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            margin-bottom: 22px;
            color: rgba(255,255,255,0.8);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 46px;
            margin-bottom: 16px;
            padding: 0 14px;
            border-radius: 12px;
            border: none;
            outline: none;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #2f67ff, #7b3cff);
            color: white;
            font-weight: 800;
            cursor: pointer;
        }

        .back-link {
            display: block;
            margin-top: 16px;
            text-align: center;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .errorlist {
            color: #ffd4d4;
            font-size: 12px;
            list-style: none;
            padding: 0;
        }
    </style>
</head>
<body>
    <form method="post" class="login-card">
        {% csrf_token %}

        <h1>Вход партнера</h1>
        <div class="subtitle">Личный кабинет партнера PARTNETIX</div>

        {{ form.non_field_errors }}

        <label for="{{ form.username.id_for_label }}">Логин</label>
        {{ form.username }}

        <label for="{{ form.password.id_for_label }}">Пароль</label>
        {{ form.password }}

        <button type="submit">Войти</button>

        <a href="/" class="back-link">На главную</a>
    </form>
</body>
</html>
