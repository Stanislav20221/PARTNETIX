    <div class="modal" id="offer-modal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">Добавить оффер</div>
                <button type="button" class="close-btn" id="close-offer-modal">&times;</button>
            </div>

            <form method="post" action="{% url 'create_offer' %}" enctype="multipart/form-data" class="offer-form">
                {% csrf_token %}

                <div class="form-grid">
                    <div class="form-group full">
                        <label class="form-label" for="{{ form.title.id_for_label }}">Название оффера</label>
                        {{ form.title }}
                    </div>

                    <div class="form-group full">
                        <label class="form-label" for="{{ form.description.id_for_label }}">Описание оффера</label>
                        {{ form.description }}
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="{{ form.payout_type.id_for_label }}">Форма выплаты</label>
                        {{ form.payout_type }}
                    </div>

                    <div class="form-group">
                        <label class="form-label reward-label" for="{{ form.reward.id_for_label }}">
                            Вознаграждение (₽)
                        </label>
                        {{ form.reward }}
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="{{ form.activity_start.id_for_label }}">Начало активности</label>
                        {{ form.activity_start }}
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="{{ form.activity_end.id_for_label }}">Конец активности</label>
                        {{ form.activity_end }}
                    </div>
                        <div class="form-group full">
                            <label class="form-label">Промоматериалы</label>

                            <label class="upload-btn" for="promo-create">
                                Добавить файлы
                            </label>

                            <input
                                type="file"
                                name="promo_materials"
                                id="promo-create"
                                hidden
                                multiple
                            >
                        </div>
                </div>

                <button type="submit" class="submit-btn">Сохранить оффер</button>
            </form>
        </div>
    </div>
